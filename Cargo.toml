[workspace]
resolver = "3"
members = [
  "crates/gozo",
  "crates/gozo-go",
  "crates/gozo-doctor",
  "crates/gozo-core",
  "crates/gozo-deploy",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PunGrumpy/gozo"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.12"
toml = "0.9"
notify = "8"
notify-debouncer-mini = "0.6"
globset = "0.4"
ureq = { version = "3", features = ["json"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
shell-words = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
