name: "Documentation update or improvement"
description: A request to update or improve documentation
title: "📚 Docs: "
labels:
  - "area: docs"
body:
  - type: markdown
    attributes:
      value: Before opening this issue, is this something you can help us with? Contributions are welcome.
  - type: textarea
    attributes:
      label: What is the improvement or update you wish to see?
      description: "Example: I would like to see more examples of `gozo deploy --target kubernetes`."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Is there any context that might help us understand?
    validations:
      required: true
  - type: input
    attributes:
      label: Does the docs page already exist? Please link to it.
    validations:
      required: false
