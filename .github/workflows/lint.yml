name: Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTFLAGS: "-D warnings"
  TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

permissions:
  contents: read

jobs:
  rust_fmt:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Run cargo fmt check
        run: cargo fmt --all --check

  rust_clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: gozo-debug-build
          save-cache: true

      - name: Run cargo clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

  quality:
    name: Quality (turbo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: gozo-debug-build

      - name: Quality
        run: bun run verify
