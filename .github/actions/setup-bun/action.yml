name: "gozo Bun Setup"
description: "Sets up Bun (from package.json packageManager) plus Node.js, and installs the workspace"
inputs:
  extra-flags:
    description: "Extra flags to pass to bun install."
    required: false
    default: ""
  package-install:
    description: "Set to false to skip the install step."
    required: false
    default: "true"
  node-version:
    description: "Node version to install (defaults to package.json engines.node)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: "package.json"

    # Node is still needed: turbo, changesets and npm publish run on it.
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: "package.json"
        node-version: ${{ inputs.node-version }}

    - name: Cache bun install cache
      if: ${{ inputs.package-install == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-

    - name: bun install
      id: install
      if: ${{ inputs.package-install == 'true' }}
      continue-on-error: true
      shell: bash
      run: bun install --frozen-lockfile ${{ inputs.extra-flags }}

    - name: bun install (second try)
      if: ${{ steps.install.outcome == 'failure' }}
      shell: bash
      run: bun install --frozen-lockfile ${{ inputs.extra-flags }}
